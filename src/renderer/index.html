<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The shell is the app's own UI, so it gets a real policy: no eval, no
      remote code, no objects. `style-src` keeps 'unsafe-inline' because Vue
      writes dynamic inline styles, and Vite injects <style> tags in dev.
      `connect-src 'self'` covers the dev server's same-origin HMR WebSocket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Tlachialoni</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
