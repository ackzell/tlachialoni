# pnpm settings for tlachialoni.
#
# `allowBuilds` lists the packages whose install scripts may run. Everything else
# is blocked, which is pnpm's default and worth keeping.
#
# `electron@44.5.1` is deliberately absent. It ships `install.js` but its
# package.json declares no `scripts` key, so there is nothing here for pnpm to
# approve — the binary is fetched by the `postinstall` in this repo's
# package.json instead. Without that, a fresh clone installs an `electron` with
# no `dist/` and `npm run dev` fails immediately.
allowBuilds:
  # Downloads/links the platform binary. Required by every Vite build.
  esbuild: true
  # Selects the bundled 7-Zip arch. Only used by the Windows NSIS target, but
  # electron-builder lists it as a dependency either way.
  electron-winstaller: true
