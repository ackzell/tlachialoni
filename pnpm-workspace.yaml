# pnpm settings for tlachialoni.
#
# `allowBuilds` lists the packages whose install scripts may run. Everything else
# is blocked, which is pnpm's default and worth keeping.
#
# `electron` is deliberately absent. It ships `install.js` but its
# package.json declares no `scripts` key, so there is nothing here for pnpm to
# approve — the binary is fetched by the `postinstall` in this repo's
# package.json instead. Without that, a fresh clone installs an `electron` with
# no `dist/` and `npm run dev` fails immediately.
allowBuilds:
  # Downloads/links the platform binary. Required by every Vite build.
  esbuild: true
  # Selects the bundled 7-Zip arch. Only used by the Windows NSIS target, but
  # electron-builder lists it as a dependency either way.
  electron-winstaller: true
# pnpm writes an exact-version entry here when an upgrade installs a package
# that is newer than its minimum release age. Keep these entries: without them
# the release-age check rejects the install. The list grows with each upgrade.
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
